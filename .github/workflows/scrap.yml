name: 📅 Schedule Workflow Dispatch
on:
  schedule:
    - cron: "0 0 */2 * *" # every 2 days
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        env:
          GITHUB_TOKEN: ${{secrets.GIT_PAT}}
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.313.0
        with:
          bundler-cache: true
      - name: Fetch Data
        working-directory: ./scrapper
        run: |
          bundle install
          ruby scrapper.rb
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final.json
          git commit -m "Update movies" || echo "No changes"
          git push
