name: Build Github pages
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: "pages"
permissions:
  contents: read
  id-token: write
  pages: write
jobs:
  build-pages:
    runs-on: ubuntu-latest
    env:
      RUBY_VERSION: "3.4.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          submodules: recursive
      - name: Setup Ruby
        run: |
          gpg --keyserver keyserver.ubuntu.com --recv-keys 409B6B1796C275462A1703113804BB82D39DC0E3 7D2BAF1CF37B13E2069D6956105BD0E739499BDB
          curl -sSL https://get.rvm.io | bash -s stable --ruby
          source $HOME/.rvm/scripts/rvm
          rvm install ${{ env.RUBY_VERSION }}
          rvm use ${{ env.RUBY_VERSION }} --default
          gem install bundler

      - name: Fetch Data
        working-directory: ./scrapper
        env:
          SITE_URL1: ${{vars.site_url1}}
          SITE_URL2: ${{vars.site_url2}}
        run: |
          source $HOME/.rvm/scripts/rvm
          bundle install
          mkdir {urls,data}
          ruby scrapper.rb
      - name: Setup NPM
        uses: actions/setup-node@v6
        with:
          check-latest: false
          node-version: "25.9.0"
      - name: Build with NPM
        run: npm i && npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
