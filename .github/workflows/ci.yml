name: Build Github pages
on:
  push:
    branches:
      - main
  pull_request:
   branches: 
      - main
  workflow_dispatch:
concurrency:
  cancel-in-progress: false
  group: "pages" 
permissions:
  contents: read
  id-token: write
  pages: write
jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          submodules: recursive
      - name: Setup NPM
        uses: actions/setup-node@v6
        with:
          check-latest: false
          node-version: "25.9.0"
      - name: Build with NPM
        run: npm i && npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
